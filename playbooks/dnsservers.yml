---
- name: "Configure the environment for DNS configuration."
  hosts: all:!dns_only
  roles:
    - role: bloodymage.autonomy.autoconfig
      tags:
        - always

- name: "Configure Bind Servers."
  hosts: bind_servers
  tasks:
    - name: "Include Bind Role."
      ansible.builtin.include_role:
        name: bloodymage.autonomy.bind
      tags:
        - install-packages
        - bind
        - bind-dyndns
        - bind-dyndns-keyupdate
        - bind-rpz

- name: "Update DNS Records."
  hosts: all:!localhost
  ignore_unreachable: true
  tasks:
    - name: "Include Maintenance Role."
      ansible.builtin.include_role:
        name: bloodymage.autonomy.maintenance
      vars:
        __maintenance_tasks: "dns"
      tags:
        - maintenance
        - dns
        - dns-file
        - dns-nsupdate
        - dns-cloudflare
