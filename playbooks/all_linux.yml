---
# ==================================================================================================
#
# Common Linux configuration
#
# ==================================================================================================
- name: "Basic Linux Host Configuration."
  hosts: linux:!localhost:!vendor_managed:!public_zone:!virtual_hosts:!dns_only
  roles:
    - role: bloodymage.autonomy.etc
      vars:
        __etc_tasks: "skel"
      when:
        - ansible_connection != "local"
      tags:
        - skel

    - role: bloodymage.autonomy.etc
      vars:
        __etc_tasks: "fstab"
      when:
        - ansible_connection != "local"
        - autonomy_fstab is truthy
      tags:
        - fstab

    - role: bloodymage.autonomy.fail2ban
      when:
        - ansible_connection != "local"
      tags:
        - fail2ban

    - role: bloodymage.autonomy.etc
      vars:
        __etc_tasks: "timezone"
      when:
        - ansible_connection != "local"
      tags:
        - timezone

    - role: bloodymage.autonomy.unattendedupgrades
      when:
        - ansible_connection != "local"
      tags:
        - unattended-upgrades
        - unattendedupgrades

    - role: bloodymage.autonomy.users
      vars:
        __user_tasks: "dotfiles"
      when:
        - inventory_hostname != "localhost"
      tags:
        - dotfiles
        - users-dotfiles
        - user-dotfiles

    - role: bloodymage.autonomy.sudo
      when:
        - ansible_connection != "local"
      tags:
        - sudo

    - role: bloodymage.autonomy.screen
      when:
        - ansible_connection != "local"
        - autonomy_screen_enabled
      tags:
        - screen

    - role: bloodymage.autonomy.rsync
      when:
        - ansible_connection != "local"
      tags:
        - rsync

    - role: bloodymage.autonomy.curl
      when:
        - ansible_connection != "local"
      tags:
        - curl

    - role: bloodymage.autonomy.keychain
      when:
        - ansible_connection != "local"
        - autonomy_keychain_enabled
      tags:
        - keychain

    - role: bloodymage.autonomy.man
      when:
        - ansible_connection != "local"
      tags:
        - man

    - role: bloodymage.autonomy.rename
      when:
        - ansible_connection != "local"
      tags:
        - rename

    - role: bloodymage.autonomy.members
      when:
        - ansible_connection != "local"
      tags:
        - members

    - role: bloodymage.autonomy.bashcompletion
      when:
        - ansible_connection != "local"
      tags:
        - bash-completion

    - role: bloodymage.autonomy.ispell
      when:
        - ansible_connection != "local"
      tags:
        - ispell

    - role: bloodymage.autonomy.make
      when:
        - ansible_connection != "local"
      tags:
        - make

    - role: bloodymage.autonomy.uptimed
      when:
        - ansible_connection != "local"
        - autonomy_uptimed_enabled
      tags:
        - uptimed

    - role: bloodymage.autonomy.htop
      when:
        - ansible_connection != "local"
      tags:
        - htop

    - role: bloodymage.autonomy.python
      when:
        - ansible_connection != "local"
      tags:
        - python

    - role: bloodymage.autonomy.cron
      when:
        - ansible_connection != "local"
      tags:
        - cron

    - role: bloodymage.autonomy.trashcli
      when:
        - ansible_connection != "local"
        - autonomy_trashcli_enabled
      tags:
        - trash-cli
        - trashcli

    - role: bloodymage.autonomy.ownca
      vars:
        __ownca_tasks: "dhparams"
      tags:
        - ownca-host-dhparams
        - ownca-dhparams


# ==================================================================================================
#
# Finally, we configure settings based on OS Distribution Family:
#
# - Debian
#
# Planned edition:
#   - arch
#   - gentoo
#   - redhat
#
# Note:
# - !vendor_managed is included to exclude devices that are detected as debian family, while also
#   being managed by vendor specific update process (Ubiquity, Mikrotik, TP-Link, etc)
#
# ==================================================================================================
- name: "Basic settings for Debian Family Hosts."
  hosts: debian:!localhost:!vendor_managed:!dns_only:!virtual_hosts
  roles:
    - role: bloodymage.autonomy.apt
      when:
        - ansible_connection != "local"
      tags:
        - apt
