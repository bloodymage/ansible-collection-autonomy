---
- name: "Prepare playbook environment."
  hosts: all:!vendor_managed
  ignore_unreachable: true
  roles:
    - role: bloodymage.autonomy.autoconfig
      tags:
        - always

- name: "Prepare playbook environment (Realm Specific)."
  hosts: all:!public_zone:!vendor_managed
  ignore_unreachable: true
  tasks:
    - name: "Run Autoconfig."
      ansible.builtin.include_role:
        name: bloodymage.autonomy.autoconfig
      vars:
        __env_tasks: "realm"

