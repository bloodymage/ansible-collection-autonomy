---
# ==================================================================================================
#
# Gather some information.  This is always done, as it'll create groups used later in this playbook.
#
# ==================================================================================================
- name: "Gather facts for Mikrotik devices."
  gather_facts: false
  hosts: mikrotik
  tasks:
    - name: "Retrieve facts"
      community.routeros.facts:
        gather_subset: all

- name: "Run Autoconf Playbook."
  import_playbook: autoconf.yml

- name: "Upgrade All hosts."
  hosts: all:!localhost:!public_zone:!virtual_hosts:!dns_only
  roles:
    - role: bloodymage.autonomy.maintenance
      vars:
        __maintenance_tasks: "upgrade"
      when:
        - ansible_connection != "local"
      tags:
        - upgrade

- name: "Run Linux Host Initialization Playbook."
  import_playbook: "all_linux_init.yml"
  when:
    - ansible_system == "Linux"

# ==================================================================================================
#
# Configure setting applicable to ALL hosts.
#
# ==================================================================================================
- name: "Basic host configuration for all hosts."
  hosts: all:!localhost:!public_zone:!virtual_hosts:!dns_only:!vendor_managed
  strategy: linear
  roles:
    - role: bloodymage.autonomy.etc
      vars:
        __etc_tasks: "hostname"
      when:
        - ansible_connection != "local"
      tags:
        - hostname

    - role: bloodymage.autonomy.users
      vars:
        autonomy_user_dotfiles_users:
          - "{{ autonomy_common_users }}"
        __user_tasks: "local_users"
      tags:
        - users

    - role: bloodymage.autonomy.sshca
      vars:
        __sshca_tasks: "usercerts"
      tags:
        - sshca
        - sshca-user-certs

    - role: bloodymage.autonomy.etc
      vars:
        __etc_tasks: "hosts"
      tags:
        - hosts

    - role: bloodymage.autonomy.emacs
      when:
        - autonomy_common_emacs_enabled
      tags:
        - emacs

    - role: bloodymage.autonomy.unzip
      when:
        - autonomy_common_unzip_enabled
      tags:
        - unzip

- name: "Run OwnCA Host Certificates Playbook."
  import_playbook: "ownca_host_certs.yml"

- name: "Run DoDCA Playbook."
  import_playbook: "dodca.yml"

- name: "Run All Linux Hosts Playbook."
  import_playbook: "all_linux.yml"
