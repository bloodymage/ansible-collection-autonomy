---
- name: "Print acme_challenge DNS."
  ansible.builtin.debug:
    msg:
      - record: "{{ item['key'] }}"
      - value: "{{ item['value'][0] }}"
    verbosity: 1
  become: false
  with_dict: "{{ __autonomy_acmeca_challenge['challenge_data_dns'] }}"
  tags:
    - acmeca
    - acmeca-test
    - acmeca-cert
    - acmeca-certs
    - acmeca-dns

- name: "Creating dns-01 challenge DNS entries."
  community.general.cloudflare_dns:
    api_token: "{{ __cloudflare_key }}"
    zone: "{{ autonomy_common_root_domain }}"
    record: "{{ item.key }}"
    type: TXT
    value: "{{ item.value[0] }}"
    solo: true
    state: "present"
    ttl: 60
  with_dict: "{{ __autonomy_acmeca_challenge['challenge_data_dns'] }}"
  become: false
  delegate_to: localhost
  vars:
    __password_lookup: "{{ autonomy_common_password_root_ext_services }}/cloudflare/dns"
    __cloudflare_key: "{{ lookup('community.general.passwordstore', __password_lookup) }}"
  tags:
    - acmeca
    - acmeca-test
    - acmeca-cert
    - acmeca-certs
    - acmeca-dns

