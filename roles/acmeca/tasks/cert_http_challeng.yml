---
- name: "Print acme_challenge."
  ansible.builtin.debug:
    msg:
      - record: "{{ __record }}"
      - value: "{{ __value }}"
    verbosity: 1
  become: false
  vars:
    __record: "{{ acme_challenge['challenge_data'][inventory_hostname]['dns-01'].record }}"
    __value: "{{ acme_challenge['challenge_data'][inventory_hostname]['dns-01'].resource_value }}"
  when:
    - acme_challenge is defined
    - acme_challenge['challenge_data'][inventory_hostname] is defined
    - acme_challenge.changed
    - autonomy_acmeca_challenge_type == "http-01"
  tags:
    - acmeca
    - acmeca-http

- name: "Create acmeca challenge host."
  ansible.builtin.template:
    src: "etc/apache/sites-available/apache-site.conf.j2"
    dest: "/etc/apache2/sites-available/{{ item.name }}.conf"
    owner: "root"
    group: "root"
    mode: "0644"
  loop: "{{ autonomy_common_virtual_hosts }}"
  when:
    - autonomy_common_virtual_hosts is defined
    - item.certificate == "acme"
    - item.content is not defined
    - inventory_hostname in groups['apache_servers']
  tags:
    - acmeca
    - acmeca-challenge-site

- name: "Create .well-known/acme-challenge directory"
  ansible.builtin.file:
    path: /srv/www/{{ item.name }}/.well-known/acme-challenge
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: "{{ virtual_hosts }}"
  become: true
  when:
    - virtual_hosts is defined
    - item.certificate == "acme"

- name: "Implement http-01 challenge files"
  ansible.builtin.copy:
    content: "{{ acme_challenge['results'][my_index]['challenge_data'][item.name]['http-01']['resource_value'] }}"
    dest: "/srv/www/{{ item.name }}/{{ acme_challenge['results'][my_index]['challenge_data'][item.name]['http-01']['resource'] }}"
    owner: www-data
    group: www-data
    mode: "0644"
  loop: "{{ virtual_hosts }}"
  loop_control:
    index_var: my_index
  become: true
  when:
    - virtual_hosts is defined
    - item.certificate == "acme"
    - acme_challenge['results'][my_index]['challenge_data'][item.name] is defined
