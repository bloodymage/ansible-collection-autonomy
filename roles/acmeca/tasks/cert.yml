    - __autonomy_acmeca_challenge['challenge_data_dns'] is defined
    - __autonomy_acmeca_challenge.changed
  tags:
    - acmeca
    - acmeca-test
    - acmeca-cert
    - acmeca-certs
    - acmeca-dns
