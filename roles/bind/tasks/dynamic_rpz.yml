---
# ==================================================================================================
#
# Check if a keyfile exists.
#
# ==================================================================================================
- name: "Check if a RPZ keyfile exists."
  ansible.builtin.stat:
    path: "{{ autonomy_bind_key_dir }}/{{ item['name'] }}.key"
  loop: "{{ autonomy_common_dns_rpz_zones }}"
  become: true
  register: existing_ddns_keys
  when:
    - item['definition'] == 'dynamic'

