---
- name: "Ensure keys directory is present."
  ansible.builtin.file:
    path: "{{ autonomy_bind_key_dir }}"
    state: directory
    owner: "{{ autonomy_common_bind_owner }}"
    group: "{{ autonomy_common_bind_group }}"
    mode: '0750'
  become: true
  when:
    - autonomy_common_virtual_host is falsy
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

- name: "Check if a keyfile exists."
  ansible.builtin.stat:
    path: "{{ autonomy_bind_key_dir }}/{{ autonomy_common_zone_name }}.key"
  become: true
  register: existing_ddns_keys
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

- name: "Check if we are forcing a key change."
  ansible.builtin.set_fact:
    autonomy_bind_dyndns_force_key_change: true
  tags:
    - never
    - bind-dyndns-force-key-change

# - name: "Print existing dynamic key information."
#   ansible.builtin.debug:
#     msg:
#       - "Name:        {{ item['item']['name'] }}"
#       - "Type:        {{ item['item']['type'] }}"
#       - "Domain:      {{ item['item']['domain'] }}"
#       - "File Status: {{ item['stat'] }}"
#     verbosity: 1
#   loop: "{{ existing_ddns_keys }}"

- name: "Print complete existing dynamic key information."
  ansible.builtin.debug:
    msg:
      - "{{ existing_ddns_keys }}"
    verbosity: 1
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

# ==================================================================================================
#
# We're using shell here for use of pipes...
#
# ==================================================================================================
- name: "Get existing key algorithm."
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      cat "{{ existing_ddns_keys['stat']['path'] }}" |
      grep algorithm |
      cut -d\  -f4 |
      cut -d\; -f1
    executable: /bin/bash
  become: true
  register: algorithms
  changed_when: algorithms.stdout != autonomy_common_dyndns_key_algorithm
  when:
    - existing_ddns_keys['stat']['exists'] is defined
    - existing_ddns_keys['stat']['exists']
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

# - name: "Print existing algorithm information."
#   ansible.builtin.debug:
#     msg:
#       - "Algorithm Name: {{ item['item']['item']['item'] }}"
#       - "Algorithm: {{ item['stdout'] }}"
#     verbosity: 1
#   loop: "{{ algorithms }}"

- name: "Print complete existing algorithm information."
  ansible.builtin.debug:
    msg:
      - "{{ algorithms }}"
    verbosity: 1
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

- name: "Add existing algorithm and keyfile status to zone information."
  ansible.builtin.set_fact:
    __bind_ddns_zones: "{{ __bind_ddns_zones + [__zone] }}"
  vars:
    __zone:
      name: "{{ autonomy_common_zone_name }}"
      domain: "{{ autonomy_common_zone_domain }}"
      existing_algorithm: "{{ algorithms['stdout'] | default(omit) }}"
      keyfile_status: "{{ existing_ddns_keys['exists'] | default(false)}}"
      samba_domain: "{{ __bind_dns_zone_samba_domain }}"
  delegate_to: localhost
  become: false
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

- name: "Print updated zone information."
  ansible.builtin.debug:
    msg:
      - "{{ __bind_ddns_zones }}"
    verbosity: 1
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

# ==================================================================================================
#
# Generate missing and update existing keys
#
# This runs if the keyfile doesn't exist or
# The current dynamic key algorithm doesn't match the desired algorithm
#
# Registers: bind_ddns_keys
#
# We're using shell instead of command here because we are using '&&' and pipes.
#
# Setting changed_when to false because we aren't actually changing anything.  Simply generating
# a value to store in a variable.
#
# ==================================================================================================
- name: "Generate missing keys and update existing keys."
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      {{ autonomy_bind_ddns_confgen }} -a {{ autonomy_common_dyndns_key_algorithm }} -k {{ autonomy_common_zone_name }} -z {{ autonomy_common_zone_domain }} |
      grep secret |
      cut -d\" -f2
    executable: /bin/bash
  become: true
  register: bind_ddns_keys
  changed_when: false
  when: >
    (__bind_ddns_zones['keyfile_status'] is not defined) or
    (not __bind_ddns_zones['keyfile_status']) or
    (__bind_ddns_zones['existing_algorithm'] != autonomy_common_dyndns_key_algorithm) or
    (autonomy_bind_dyndns_force_key_change) and
    (inventory_hostname not in groups['samba_domain_controllers'] | default([]))
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

- name: "Print dynamic key information."
  ansible.builtin.debug:
    msg:
      - "{{ bind_ddns_keys }}"
    verbosity: 1
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change

# ==================================================================================================
#
# Install the ddns keys.
#
# Update key in password-store
# when:
#   - keyfile does not exist
#   - force update key
#
# ==================================================================================================
- name: "Install Dynamic DNS Keys."
  ansible.builtin.template:
    src: "etc/bind/ddns_key.j2"
    dest: "{{ autonomy_bind_key_dir }}/{{ autonomy_common_zone_name }}.key"
    owner: root
    group: bind
    mode: "0640"
  become: true
  notify: restart bind
  #no_log: true
  vars:
    __password_userpass: "userpass={{ bind_ddns_keys['stdout'] }}"
    __password_lookup: "{{ autonomy_bind_dyndns_password_store_lookup }} {{ __password_userpass }}"
    autonomy_bind_dyndns_secret: "{{ lookup('community.general.passwordstore', __password_lookup) }}"
  when:
    - bind_ddns_keys['skipped'] is not defined
  tags:
    - bind
    - bind-dyndns
    - bind-dyndns-force-key-change
