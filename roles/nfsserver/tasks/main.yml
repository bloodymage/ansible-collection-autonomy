---
# tasks file for nfs_server
- name: "Include OS-specific variables."
  include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ __os_variables_files }}"
      paths:
        - "vars"
  become: false

- name: "Install packages."
  ansible.builtin.package:
    name: "{{ autonomy_nfsserver_packages }}"
    state: present
  become: true

