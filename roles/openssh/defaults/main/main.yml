---
autonomy_openssh_packages:
  - openssh-client
  - openssh-server

# ==================================================================================================
#
# Files and Directories
#
# ==================================================================================================
autonomy_openssh_sshd_conf_file: "sshd_config"
autonomy_openssh_ssh_conf_file: "ssh_config"
autonomy_openssh_ssh_known_hosts_file: "ssh_known_hosts"
# autonomy_openssh_ssh_revoked_host_keys_file:
autonomy_openssh_moduli_file: "moduli"
autonomy_openssh_sshd_pid_file: "sshd.pid"

autonomy_openssh_ssh_conf_d_dir: "{{ autonomy_common_openssh_sysconf_dir }}/ssh_config.d"
autonomy_openssh_sshd_conf_d_dir: "{{ autonomy_common_openssh_sysconf_dir }}/sshd_config.d"

autonomy_openssh_host_key_path: "{{ autonomy_common_openssh_sysconf_dir }}/{{ autonomy_common_openssh_host_key_file }}"
autonomy_openssh_sshd_conf_path: "{{ autonomy_common_openssh_sysconf_dir }}/{{ autonomy_openssh_sshd_conf_file }}"
autonomy_openssh_ssh_conf_path: "{{ autonomy_common_openssh_sysconf_dir }}/{{ autonomy_openssh_ssh_conf_file }}"
autonomy_openssh_ssh_known_hosts_path: "{{ autonomy_common_openssh_sysconf_dir }}/{{ autonomy_openssh_ssh_known_hosts_file }}"
autonomy_openssh_moduli_path: "{{ autonomy_common_openssh_sysconf_dir }}/{{ autonomy_openssh_moduli_file }}"
autonomy_openssh_sshd_pid_path: "{{ autonomy_common_run_dir }}/{{ autonomy_openssh_sshd_pid_file }}"

autonomy_openssh_config_files:
  - name: "{{ autonomy_openssh_sshd_conf_file }}"
    path: "{{ autonomy_openssh_sshd_conf_path }}"
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  - name: "{{ autonomy_openssh_ssh_conf_file }}"
    path: "{{ autonomy_openssh_ssh_conf_path }}"
  - name: "{{ autonomy_openssh_ssh_known_hosts_file }}"
    path: "{{ autonomy_openssh_ssh_known_hosts_path }}"

# autonomy_openssh_authorized_keys: "authorized_keys"
autonomy_openssh_authorized_principals: "%u"

autonomy_sshca_hostca_known_hosts:
  - "@cert-authority *.{{ autonomy_common_root_domain }} {{ __openssh_host_ca_public_key }}"
#
__autonomy_openssh_sshd_pid_path: "/run/sshd.pid"
