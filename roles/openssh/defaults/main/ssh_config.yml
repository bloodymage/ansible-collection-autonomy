  - ecdsa-sha2-nistp256-cert-v01@openssh.com
  - ecdsa-sha2-nistp384-cert-v01@openssh.com
  - ecdsa-sha2-nistp521-cert-v01@openssh.com
  - sk-ssh-ed25519-cert-v01@openssh.com
  - sk-ecdsa-sha2-nistp256-cert-v01@openssh.com
  - rsa-sha2-512-cert-v01@openssh.com
  - rsa-sha2-256-cert-v01@openssh.com
  - ssh-ed25519
  - ecdsa-sha2-nistp256
  - ecdsa-sha2-nistp384
  - ecdsa-sha2-nistp521
  - sk-ssh-ed25519@openssh.com
  - sk-ecdsa-sha2-nistp256@openssh.com
  - rsa-sha2-512
  - rsa-sha2-256
__autonomy_openssh_ssh_conf_hostbased_authentication: "no"
__autonomy_openssh_ssh_conf_host_key_algorithms:
  - ssh-ed25519-cert-v01@openssh.com
  - ecdsa-sha2-nistp256-cert-v01@openssh.com
  - ecdsa-sha2-nistp384-cert-v01@openssh.com
  - ecdsa-sha2-nistp521-cert-v01@openssh.com
  - sk-ssh-ed25519-cert-v01@openssh.com
  - sk-ecdsa-sha2-nistp256-cert-v01@openssh.com
  - rsa-sha2-512-cert-v01@openssh.com
  - rsa-sha2-256-cert-v01@openssh.com
  - ssh-ed25519
  - ecdsa-sha2-nistp256
  - ecdsa-sha2-nistp384
  - ecdsa-sha2-nistp521
  - sk-ecdsa-sha2-nistp256@openssh.com
  - sk-ssh-ed25519@openssh.com
  - rsa-sha2-512
  - rsa-sha2-256
__autonomy_openssh_ssh_conf_identities_only: "no"
__autonomy_openssh_ssh_conf_identity_agent: ""
__autonomy_openssh_ssh_conf_kbd_interactive_authentication: "yes"
__autonomy_openssh_ssh_conf_kex_algorithms:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - ecdh-sha2-nistp256
  - ecdh-sha2-nistp384
  - ecdh-sha2-nistp521
  - diffie-hellman-group-exchange-sha256
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group14-sha256
__autonomy_openssh_ssh_conf_no_host_authentication_for_localhost: "no"
__autonomy_openssh_ssh_conf_number_of_password_promts: 3
__autonomy_openssh_ssh_password_authentication: "yes"
__autonomy_openssh_ssh_conf_pkcs11_provider: "none"
__autonomy_openssh_ssh_conf_port: 22
__autonomy_openssh_ssh_conf_strict_host_key_checking: "ask"
__autonomy_openssh_ssh_conf_user_known_hosts_file:
  - "~/.ssh/known_hosts"
  - "~/.ssh/known_hosts2"

