# ==================================================================================================
#
# Default ssh_config options
#
# ==================================================================================================
__autonomy_openssh_ssh_conf_add_keys_to_agent: "no"
__autonomy_openssh_ssh_conf_address_family: "any"
__autonomy_openssh_ssh_conf_batch_mode: "no"
__autonomy_openssh_ssh_conf_canonicalize_fallback_local: "yes"
__autonomy_openssh_ssh_conf_canonicalize_hostname: "no"
__autonomy_openssh_ssh_conf_canonicalize_max_dots: 1
__autonomy_openssh_ssh_conf_ca_signature_algorithms:
  - ssh-ed25519
  - ecdsa-sha2-nistp256
  - ecdsa-sha2-nistp384
  - ecdsa-sha2-nistp521
  - sk-ssh-ed25519@openssh.com
  - sk-ecdsa-sha2-nistp256@openssh.com
  - rsa-sha2-512
  - rsa-sha2-256
__autonomy_openssh_ssh_conf_channel_timeout: []
__autonomy_openssh_ssh_conf_check_host_ip: "no"
__autonomy_openssh_ssh_conf_ciphers:
  - chacha20-poly1305@openssh.com
  - aes128-gcm@openssh.com
  - aes256-gcm@openssh.com
  - aes128-ctr
  - aes192-ctr
  - aes256-ctr
__autonomy_openssh_ssh_conf_clear_all_forwardings: "no"
__autonomy_openssh_ssh_conf_compression: "no"
__autonomy_openssh_ssh_conf_connection_attempts: 1
__autonomy_openssh_ssh_conf_control_master: "no"
__autonomy_openssh_ssh_conf_control_persist: "no"
__autonomy_openssh_ssh_conf_enable_ssh_keysign: "no"
__autonomy_openssh_ssh_conf_escape_char: "~"
__autonomy_openssh_ssh_conf_exit_on_forward_failure: "no"
__autonomy_openssh_ssh_conf_fingerprint_hash: "sha256"
__autonomy_openssh_ssh_conf_fork_after_authentication: "no"
__autonomy_openssh_ssh_conf_forward_agent: "no"
__autonomy_openssh_ssh_conf_forward_x11: "no"
__autonomy_openssh_ssh_conf_forward_x11_timeout: ""
__autonomy_openssh_ssh_conf_forward_x11_trusted: "no"
__autonomy_openssh_ssh_conf_gateway_ports: "no"
__autonomy_openssh_ssh_conf_global_known_hosts_file:
  - "{{ autonomy_common_openssh_sysconf_dir }}/{{ autonomy_openssh_ssh_known_hosts_file }}"
  - "{{ autonomy_common_openssh_sysconf_dir }}/{{ autonomy_openssh_ssh_known_hosts_file }}2"
__autonomy_openssh_ssh_conf_gssapi_authentication: "no"
__autonomy_openssh_ssh_conf_gssapi_delegate_credentials: "no"
__autonomy_openssh_ssh_conf_gssapi_key_exchange: "no"
__autonomy_openssh_ssh_conf_gssapi_renewal_forces_rekey: "no"
__autonomy_openssh_ssh_conf_gssapi_trust_dns: "no"
__autonomy_openssh_ssh_conf_gssapi_kex_algorithems:
  - gss-group14-sha256-
  - gss-group16-sha512-
  - gss-nistp256-sha256-
  - gss-curve25519-sha256-
  - gss-gex-sha1-
  - gss-group14-sha1-
__autonomy_openssh_ssh_conf_hash_known_hosts: "no"
__autonomy_openssh_ssh_conf_hostbased_accepted_algorithms:
