---
# tasks file for clamav
- name: Include OS-specific variables.
  include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ __os_variables_files }}"
      paths:
        - "vars"
  become: false

- name: "Install packages"
  ansible.builtin.package:
    name: "{{ autonomy_clamav_packages }}"
    state: present
  become: true

- name: "Install /etc/clamav config files"
  ansible.builtin.template:
    src: "etc/clamav/{{ item }}.j2"
    dest: "/etc/clamav/{{ item }}"
    owner: root
    group: root
    mode: "0644"
    backup: "{{ 'false' if autonomy_common_etckeeper_enabled else 'true' }}"
  loop:
    - clamav-milter.conf
  become: true

- name: "Create milter socket directory"
  ansible.builtin.file:
    path: /var/spool/postfix/clamav
    state: directory
    owner: clamav
    group: root
    mode: "0755"
  become: true
