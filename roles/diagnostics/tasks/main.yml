---
# tasks file for diagnostics
- name: "Check connectivity."
  include_tasks: "ping.yml"
  tags:
    - connectivity
    - ping

- name: "Get host facts."
  include_tasks: "host_facts.yml"
  when:
    - ansible_network_os is not defined
  tags:
    - host-domain
    - host-facts
    - host-info
    - host-ipv4
    - host-ipv6
    - host-packages
    - host-system
    - host-version
    - host-vars

- name: "Get Network OS facts."
  include_tasks: "mikrotik_facts.yml"
  when:
    - ansible_network_os is defined
    - ansible_network_os == "community.routeros.routeros"
  tags:
    - host-domain
    - host-facts
    - host-info
    - host-ipv4
    - host-ipv6
    - host-packages
    - host-system
    - host-version

- name: "Display host groups."
  include_tasks: "host_groups.yml"
  tags:
    - host-groups
