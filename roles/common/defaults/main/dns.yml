---
autonomy_bind_owner: root
autonomy_bind_group: bind

autonomy_dns_ipv4_reverse_zone: "{{ autonomy_bind_ipv4_address.split('.')[0] }}.{{ autonomy_bind_ipv4_address.split('.')[1] }}"
autonomy_dns_ipv4_reverse_zone_formatted: "{{ autonomy_dns_ipv4_reverse_zone.split('.')[1] }}.{{ autonomy_dns_ipv4_reverse_zone.split('.')[0] }}"

autonomy_bind_rpz_enabled: false

autonomy_bind_rpz_primary_nameservers: []

autonomy_bind_zone_dir: "/var/lib/bind"
autonomy_bind_allow_query: "any"
autonomy_dns_cloudflare_only: false

# Allow List
autonomy_bind_rpz_allowlist_name: "allowlist"
autonomy_bind_rpz_allowlist_policy: "disabled"
autonomy_bind_rpz_allowlist_zone_file: "db.{{ autonomy_bind_rpz_allowlist_name }}.rpz"
autonomy_bind_rpz_allowlist_zone_path: "{{ autonomy_bind_zone_dir }}/{{ autonomy_bind_rpz_allowlist_zone_file }}"
autonomy_bind_rpz_allowlist_allow_query: "{{ autonomy_bind_allow_query }}"
autonomy_bind_rpz_allowlist_zone_type: "secondary"
autonomy_bind_rpz_allowlist_nameservers: "{{ autonomy_bind_rpz_primary_nameservers }}"

# Adblock
autonomy_bind_rpz_adblock_name: "adblock"
autonomy_bind_rpz_adblock_policy: "disabled"
autonomy_bind_rpz_adblock_zone_file: "db.{{ autonomy_bind_rpz_adblock_name }}.rpz"
autonomy_bind_rpz_adblock_zone_path: "{{ autonomy_bind_zone_dir }}/{{ autonomy_bind_rpz_adblock_zone_file }}"
autonomy_bind_rpz_adblock_allow_query: "{{ autonomy_bind_allow_query }}"
autonomy_bind_rpz_adblock_zone_type: "secondary"
autonomy_bind_rpz_adblock_nameservers: "{{ autonomy_bind_rpz_primary_nameservers }}"

autonomy_bind_rpz_adblock_zone:
  name: "{{ autonomy_bind_rpz_adblock_name }}"
  type: "{{ autonomy_bind_rpz_adblock_zone_type }}"
  file: "{{ autonomy_bind_rpz_adblock_zone_file }}"
  policy: "{{ autonomy_bind_rpz_adblock_policy }}"
  path: "{{ autonomy_bind_rpz_adblock_zone_path }}"
  allow_query: "{{ autonomy_bind_rpz_adblock_allow_query }}"
  definition: "dynamic"
  nameservers: "{{ autonomy_bind_rpz_adblock_nameservers }}"

autonomy_bind_rpz_allowlist_zone:
  name: "{{ autonomy_bind_rpz_allowlist_name }}"
  type: "{{ autonomy_bind_rpz_allowlist_zone_type }}"
  file: "{{ autonomy_bind_rpz_allowlist_zone_file }}"
  policy: "{{ autonomy_bind_rpz_allowlist_policy }}"
  path: "{{ autonomy_bind_rpz_allowlist_zone_path }}"
  allow_query: "{{ autonomy_bind_rpz_allowlist_allow_query }}"
  definition: "dynamic"
  nameservers: "{{ autonomy_bind_rpz_allowlist_nameservers }}"

autonomy_bind_rpz_zones:
  - "{{ autonomy_bind_rpz_allowlist_zone }}"
  - "{{ autonomy_bind_rpz_mozilla_zone }}"
  - "{{ autonomy_bind_rpz_adblock_zone }}"

autonomy_dns_adblock_records:
  - "*.doubleclick.net"
  - "*.pubmatic.com"
  - "*.mopub.com"
  - "*.eskimi.com"
  - "*.adcolony.xyz"
  - "*.adsrvr.org"
  - "*.adsymptotic.com"
  - "*.servedby-buysellads.com"
  - "srv.buysellads.com"
  - "*.powerinboxedge.com"
  - "*.defof.com"
  - "*.licasd.com"
  - "*.liadm.com"
