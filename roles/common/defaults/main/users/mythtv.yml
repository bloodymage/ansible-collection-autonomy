---
# ==================================================================================================
#
# Mythtv
#
# ==================================================================================================
autonomy_common_users_mythtv_name: "MythTV"
autonomy_common_users_mythtv_groupname: "{{ autonomy_common_users_mythtv_username }}"
autonomy_common_users_mythtv_groups:
  - dialout
  - cdrom
  - audio
  - video
autonomy_common_users_mythtv_sudoers: []
autonomy_common_users_mythtv_ssh_key_type: "{{ autonomy_common_users_ssh_key_type }}"
autonomy_common_users_mythtv_ssh_key_password: "password"
autonomy_common_users_mythtv_ssh_access_cert:
  - "ansible"
autonomy_common_users_mythtv_ssh_principals:
  - "mythtv"
autonomy_common_users_mythtv_home_dir: "{{ autonomy_common_home_dir }}/{{ autonomy_common_users_mythtv_username }}"
autonomy_common_users_mythtv_gpg_keys: []
autonomy_common_users_mythtv_autostart_dir: false
autonomy_common_users_mythtv_password: "password"

autonomy_common_users_mythtv_group:
  name: "{{ autonomy_common_users_mythtv_groupname }}"
  gid: "{{ autonomy_common_users_mythtv_id_number }}"

autonomy_common_users_mythtv:
  username: "{{ autonomy_common_users_mythtv_username }}"
  name: "{{ autonomy_common_users_mythtv_name }}"
  groups: "{{ autonomy_common_users_mythtv_groups }}"
  id_number: "{{ autonomy_common_users_mythtv_id_number }}"
  unix_home: "{{ autonomy_common_users_mythtv_home_dir }}"
  ssh_key_type: "{{ autonomy_common_users_mythtv_ssh_key_type }}"
  ssh_key_password: "{{ autonomy_common_users_mythtv_ssh_key_password }}"
  ssh_access_cert: "{{ autonomy_common_users_mythtv_ssh_access_cert }}"
  ssh_principals: "{{ autonomy_common_users_mythtv_ssh_principals }}"
  sudoers: "{{ autonomy_common_users_mythtv_sudoers }}"
  gpg_keys: "{{ autonomy_common_users_mythtv_gpg_keys }}"
  git_repos: "{{ autonomy_common_users_gitrepos }}"
  autostart_dir: "{{ autonomy_common_users_mythtv_autostart_dir }}"
  password: "{{ autonomy_common_users_mythtv_password }}"
