# ==================================================================================================
#
# Enable Handlers
#
# ==================================================================================================
- name: "Enable Keycloak."
  ansible.builtin.service:
    name: keycloak
    enabled: true
    state: started
  become: true
  listen:
    - "enable keycloak"
  when:
    - inventory_hostname in groups['keycloak_servers'] | default([])

- name: "Enable SSSD Services."
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - sssd-pam
    - sssd-nss
    - sssd
  become: true
  listen:
    - "enable sssd"
  when:
    - inventory_hostname in groups['sssd'] | default([])
    - autonomy_sssd_package in ansible_facts.packages

# ==================================================================================================
#
# Reload Handlers
#
# ==================================================================================================
- name: "Reload Apache."
  ansible.builtin.service:
    name: "{{ autonomy_common_apache_daemon }}"
    state: reloaded
  become: true
  listen:
    - "reload all"
    - "reload tls"
    - "reload apache"
    - "reload {{ autonomy_common_apache_daemon }}"
  when:
    - inventory_hostname in groups['apache_servers'] | default([])

- name: "Reload nginx"
  ansible.builtin.service:
    name: nginx
    state: reloaded
  become: true
  listen:
    - "reload all"
    - "reload tls"
    - "reload nginx"
  when:
    - inventory_hostname in groups['nginx_servers'] | default([])
    - autonomy_nginx_package in ansible_facts.packages

- name: "Reload Postfix."
  ansible.builtin.service:
    name: postfix
    state: reloaded
  become: true
  listen:
    - "reload all"
    - "reload tls"
    - "reload postfix"
  when:
    - inventory_hostname in groups['postfix_servers'] | default([])
    - autonomy_postfix_package in ansible_facts.packages

- name: "Reload Samba Domain Controller"
  ansible.builtin.service:
    name: samba-ad-dc
    state: reloaded
  become: true
  listen:
    - "reload all"
    - "reload tls"
    - "reload samba-ad-dc"
  when:
    - inventory_hostname in groups['samba_domain_controllers'] | default([])
    - autonomy_samba_package in ansible_facts.packages

# ==================================================================================================
#
# Restart Service Handlers
#
# ==================================================================================================
- name: "Restart Apache."
  ansible.builtin.service:
    name: apache2
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
    - "restart apache"
    - "restart keytab"
    - "restart apache"
    - "restart apache2"
    - "restart webservers"
    - "restart acmeca"
  when:
    - inventory_hostname in groups['apache_servers'] | default([])
    # - ansible_facts.packages is defined
    # - autonomy_apache_package in ansible_facts.packages

# ==================================================================================================
#
# TODO: Check if this needs 'restart tls'
#
# Currently, the bind role does not need 'restart tls'
#
# However, bind can be configured to use tls at which point this will be needed.
#
# ==================================================================================================
- name: "Restart {{ autonomy_common_bind_daemon }}."
  ansible.builtin.service:
    name: "{{ autonomy_common_bind_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart bind"
    - "restart bind9"
    - "restart tls"
    - "restart named"
  when:
    - inventory_hostname in groups['bind_servers'] | default([])
    - ansible_facts.packages is defined
    - autonomy_common_bind_package in ansible_facts.packages

- name: "Restart cron."
  ansible.builtin.service:
    name: "{{ autonomy_common_cron_daemon }}"
    state: restarted
  listen:
    - "restart {{ autonomy_common_cron_daemon }}"
  when:
    - autonomy_cron_enabled
    - inventory_hostname in groups['linux'] | default([])

- name: "Restart DDclient."
  ansible.builtin.service:
    name: "{{ autonomy_ddclient_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart ddclient"
  when:
    - inventory_hostname in groups['ddclient_hosts'] | default([])
    - autonomy_ddclient_package in ansible_facts.packages

- name: "Restart Dovecot."
  ansible.builtin.service:
    name: "{{ autonomy_dovecot_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
    - "restart keytab"
    - "restart dovecot"
  when:
    - inventory_hostname in groups['dovecot_servers'] | default([])

- name: "Restart etckeeper."
  ansible.builtin.service:
    name: "{{ autonomy_common_etckeeper_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart etckeeper"
  when:
    - inventory_hostname in groups['linux'] | default([])
    - autonomy_common_etckeeper_package in ansible_facts.packages

- name: "Restart Freeradius."
  ansible.builtin.service:
    name: freeradius
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart freeradius"
  when:
    - inventory_hostname in groups['freeradius_servers'] | default([])

- name: "Restart Keycloak."
  ansible.builtin.service:
    name: keycloak
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart keycloak"
    - "restart keytab"
  when:
    - inventory_hostname in groups['keycloak_servers'] | default([])

- name: "Restart Mosquitto."
  ansible.builtin.service:
    name: mosquitto
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart mosquitto"
    - "restart acmeca"
  when:
    - inventory_hostname in groups['mosquitto_servers'] | default([])

- name: "Restart MySQL."
  ansible.builtin.service:
    name: mysql
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart mysql"
    - "restart mariadb"
  when:
    - inventory_hostname in groups ['mysql_compatable_servers'] | default([])

- name: "Restart nginx"
  ansible.builtin.service:
    name: nginx
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart nginx"
    - "restart acmeca"
  when:
    - inventory_hostname in groups ['nginx_servers'] | default([])

- name: "Restart NTP."
  ansible.builtin.service:
    name: "{{ autonomy_ntp_daemon }}"
    state: restarted
  listen:
    - "restart all"
    - "restart ntp"
    - "restart ntpsec"
    - "restart timesync"
  when:
    - (inventory_hostname in groups['ntp_servers'] | default([])) or (inventory_hostname in groups['samba_domain_controllers'] | default([]))

- name: "Restart systemd-timesyncd."
  ansible.builtin.service:
    name: "systemd-timesyncd"
    state: restarted
  listen:
    - "restart all"
    - "restart systemd-timesyncd"
    - "restart timesync"
  when:
    - inventory_hostname not in groups['ntp_servers'] | default([])
    - inventory_hostname not in groups['samba_domain_controllers'] | default([])

- name: "Restart OpenDKIM."
  ansible.builtin.service:
    name: opendkim
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart opendkim"
  when:
    - inventory_hostname in groups['opendkim_servers'] | default([])

- name: "Restart Postfix."
  ansible.builtin.service:
    name: "{{ autonomy_common_postfix_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
    - "restart keytab"
    - "restart postfix"
    - "restart acmeca"
    - "restart ownca"
  when:
    - inventory_hostname in groups['postfix_servers'] | default([])
    - ansible_facts.packages is defined
    - autonomy_postfix_package in ansible_facts.packages

- name: "Restart Samba Domain Controller."
  ansible.builtin.service:
    name: "{{ autonomy_common_samba_dc_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
    - "restart samba-ad-dc"
    - "restart samba"
  when:
    - inventory_hostname in groups['samba_domain_controllers'] | default([])

- name: "Restart SMBD Server."
  ansible.builtin.service:
    name: "{{ autonomy_common_samba_smbd_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
    - "restart smbd"
    - "restart samba file server"
    - "restart samba"
  when:
    - inventory_hostname in groups['samba_file_servers'] | default([])

- name: "Restart NMBD Server."
  ansible.builtin.service:
    name: "{{ autonomy_common_samba_nmbd_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
    - "restart samba file server"
    - "restart samba"
    - "restart nmbd"
  when:
    - inventory_hostname in groups['samba_file_servers'] | default([])

- name: "Restart SSH Server."
  ansible.builtin.service:
    name: ssh
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart ssh"
    - "restart krb5"
  when:
    - inventory_hostname in groups['linux'] | default([])

- name: "Restart Winbind Server."
  ansible.builtin.service:
    name: "{{ autonomy_common_samba_winbind_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
    - "restart samba file server"
    - "restart samba"
    - "restart winbind"
  when:
    - inventory_hostname in groups['samba_file_servers'] | default([])

- name: "Restart System Security Services Daemon."
  ansible.builtin.service:
    name: "{{ autonomy_common_sssd_daemon }}"
    state: restarted
  become: true
  listen:
    - "restart all"
    - "restart tls"
    - "restart krb5"
