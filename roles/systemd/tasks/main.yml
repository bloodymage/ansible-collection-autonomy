---
# tasks file for systemd
- name: Include OS-specific variables.
  ansible.builtin.include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ __os_variables_files }}"
      paths:
        - "vars"
  become: false
  tags:
    - systemd
    - systemd-networkd
    - systemd-timesyncd

- name: "Configure Systemd-Networkd."
  ansible.builtin.include_tasks: "networkd.yml"
  when:
    - __systemd_tasks == "networkd"
  tags:
    - systemd
    - systemd-networkd

- name: "Configure Systemd-Resolved."
  ansible.builtin.include_tasks: "resolved.yml"
  when: >
    __systemd_tasks == "networkd" or
    __systemd_tasks == "resolved"
  tags:
    - systemd
    - systemd-networkd
    - systemd-resolved

- name: "Configure Systemd-Timesyncd."
  ansible.builtin.include_tasks: "timesyncd.yml"
  when:
    - __systemd_tasks == "timesyncd"
  tags:
    - systemd
    - systemd-timesyncd
