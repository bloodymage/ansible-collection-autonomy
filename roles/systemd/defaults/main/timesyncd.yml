autonomy_systemd_timesyncd_packages:
  - systemd-timesyncd

autonomy_systemd_timesyncd_conflicts:
  - ntpsec
  - ntp

autonomy_systemd_timesyncd_server_addresses: []
autonomy_systemd_timesyncd_fallback_server_addresses: "{{ autonomy_common_ntp_server_addresses }}"

autonomy_systemd_timesyncd_root_distance_max_sec: "{{ __autonomy_systemd_timesyncd_root_distance_max_sec }}"
autonomy_systemd_timesyncd_poll_interval_min_sec: "{{ __autonomy_systemd_timesyncd_poll_interval_min_sec }}"
