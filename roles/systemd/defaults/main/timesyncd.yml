autonomy_systemd_timesyncd_connection_retry_sec: "{{ __autonomy_systemd_timesyncd_connection_retry_sec }}"
autonomy_systemd_timesyncd_save_interval_sec: "{{ __autonomy_systemd_timesyncd_save_interval_sec }}"

# Default values
__autonomy_systemd_timesyncd_root_distance_max_sec: 5
__autonomy_systemd_timesyncd_poll_interval_min_sec: 32
