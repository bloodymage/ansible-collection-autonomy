---
- name: "Update DNS records using nsupdate protocol."
  ansible.builtin.include_tasks: "dns_nsupdate.yml"
  when:
    - autonomy_common_dns_cloudflare_only is falsy
  tags:
    - dns
    - dns-nsupdate

- name: "Update DNS records using nsupdate protocol."
  ansible.builtin.include_tasks: "dns_file.yml"
  when:
    - autonomy_common_dns_rpz_zones is truthy
    - autonomy_common_dns_rpz_zone_type == "primary"
  tags:
    - dns
    - dns-file

- name: "Update DNS records using CloudFlare DNS."
  ansible.builtin.include_tasks: "dns_cloudflare.yml"
  when:
    - autonomy_maintenance_cloudflare_enabled
  tags:
    - dns
    - dns-cloudflare
