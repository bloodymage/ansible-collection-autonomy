---
# WARNING: This gets slow with large files
- name: "Identify domain changes for '{{ rpz['item']['name'] }}' (WARNING: SLOW)."
  ansible.builtin.set_fact:
    __removed_domains: "{{ __old_domains_list | difference(__new_domains_list) }}"
    __added_domains: "{{ __new_domains_list | difference(__old_domains_list) }}"
  become: false
  register: new_domains
  vars:
    __old_domains_list: "{{ __old_domains_hash_filter | select('match', '^[^;]') | select('match', '^[^@]') | list }}"
    __new_domains_list: "{{ __new_domains_hash_filter | select('match', '^[^;]') | select('match', '^[^@]') | list }}"
    __old_domains_hash_filter: "{{ __old_domains_split | select('match', '^[^#]') | list }}"
    __new_domains_hash_filter: "{{ __new_domains_split | select('match', '^[^#]') | list }}"
    __old_domains_split: "{{ __old_domains_content.splitlines() }}"
    __new_domains_split: "{{ __new_domains_content.splitlines() }}"
    __new_domains_content: "{{ lookup('file', __new_domains_path) }}"
    __old_domains_content: "{{ lookup('file', __old_domains_path) }}"
    __new_domains_path: "{{ autonomy_maintenance_dns_url_data_dir }}/{{ rpz['item']['name'] }}.txt"
    __old_domains_path: "{{ autonomy_maintenance_dns_url_data_dir }}/{{ rpz['item']['name'] }}.txt.old"
  tags:
    - dns
    - dns-file

