- name: "NSUPDATE: Add RPZ records."
  community.general.nsupdate:
    key_name: "{{ autonomy_common_zone_name }}"
    key_secret: "{{ __key_secret }}"
    key_algorithm: "{{ autonomy_common_dyndns_key_algorithm }}"
    server: "{{ autonomy_common_dns_primary_server_ip }}"
    zone: "{{ rpz['item']['name'] }}"
    record: "{{ __domain }}"
    value: "{{ __alias }}"
    type: "{{ __type }}"
    state: present
  loop: "{{ __added_domains }}"
  become: false
  vars:
    __domain: "{{ item.split(' ')[0] }}"
    #__type: "{{ item.split(' ')[1] }}"
    #__alias: "{{ item.split(' ')[2] }}"
    __type: "CNAME"
    __alias: "."
    __nameserver: "{{ autonomy_common_dns_primary_server_hostname }}"
    __password_store_id: "{{ autonomy_common_password_db }}/{{ autonomy_common_zone_domain }}/hosts/{{ __nameserver }}/bind_dyndns_secret"
    __password_lookup: "{{ __password_store_id }}"
    __key_secret: "{{ lookup('community.general.passwordstore', __password_lookup) }}"
    __dns_servers: "{{ autonomy_common_zone_name }}_dns_servers"
  delegate_to: localhost
  tags:
    - dns
    - dns-file

- name: "NSUPDATE: Remove RPZ records."
  community.general.nsupdate:
    key_name: "{{ autonomy_common_zone_name }}"
    key_secret: "{{ __key_secret }}"
    key_algorithm: "{{ autonomy_common_dyndns_key_algorithm }}"
    server: "{{ autonomy_common_dns_primary_server_ip }}"
    zone: "{{ rpz['item']['name'] }}"
    record: "{{ __domain }}"
    value: "{{ __alias }}"
    type: "{{ __type }}"
    state: absent
  loop: "{{ __removed_domains }}"
  become: false
  vars:
    __domain: "{{ item.split(' ')[0] }}"
    #__type: "{{ item.split(' ')[1] }}"
    #__alias: "{{ item.split(' ')[2] }}"
    __type: "CNAME"
    __alias: "."
    __nameserver: "{{ autonomy_common_dns_primary_server_hostname }}"
    __password_store_id: "{{ autonomy_common_password_db }}/{{ autonomy_common_zone_domain }}/hosts/{{ __nameserver }}/bind_dyndns_secret"
    __password_lookup: "{{ __password_store_id }}"
    __key_secret: "{{ lookup('community.general.passwordstore', __password_lookup) }}"
    __dns_servers: "{{ autonomy_common_zone_name }}_dns_servers"
  delegate_to: localhost
  tags:
    - dns
    - dns-nsupdate
