- name: "Cloudflare: Get public IPv4 Address."
  community.general.ipify_facts:
    api_url: "https://api.ipify.org/"
    timeout: 10
    validate_certs: true

- name: "Cloudflare: Add or modify A records."
  community.general.cloudflare_dns:
    #account_email: "{{ autonomy_dns_cloudflare_email }}"
    api_token: "{{ __cloudflare_key }}"
    zone: "{{ autonomy_domain }}"
    record: "{{ autonomy_dns_public_host }}"
    type: "A"
    value: "{{ ipify_public_ip }}"
    state: "present"
    proxied: "{{ autonomy_dns_cloudflare_proxied }}"
    solo: "{{ autonomy_dns_cloudflare_solo }}"
    timeout: "{{ autonomy_dns_cloudflare_timeout }}"
    ttl: "{{ autonomy_dns_cloudflare_ttl }}"
  become: false
  vars:
    __password_lookup: "{{ autonomy_passdb }}/{{ autonomy_domain }}/external/cloudflare/dns"
    __cloudflare_key: "{{ lookup('community.general.passwordstore', __password_lookup) }}"

- name: "Cloudflare: Add or modify AAAA records."
  community.general.cloudflare_dns:
    #account_email: "{{ autonomy_dns_cloudflare_email }}"
    api_token: "{{ __cloudflare_key }}"
    zone: "{{ autonomy_domain }}"
    record: "{{ autonomy_dns_public_host }}"
    type: "AAAA"
    value: "{{ autonomy_ipv6_address }}"
    state: "present"
    proxied: "{{ autonomy_dns_cloudflare_proxied }}"
    solo: "{{ autonomy_dns_cloudflare_solo }}"
    timeout: "{{ autonomy_dns_cloudflare_timeout }}"
    ttl: "{{ autonomy_dns_cloudflare_ttl }}"
  become: false
  vars:
    __password_lookup: "{{ autonomy_passdb }}/{{ autonomy_domain }}/external/cloudflare/dns"
    __cloudflare_key: "{{ lookup('community.general.passwordstore', __password_lookup) }}"

# ==================================================================================================
#
# FIXME: This reports a change EVERY time, even when nothing has actually changed.
#
# ==================================================================================================
- name: "Cloudflare: Add or modify CNAME records."
  community.general.cloudflare_dns:
    #account_email: "{{ autonomy_dns_cloudflare_email }}"
    api_token: "{{ __cloudflare_key }}"
    zone: "{{ item['zone'] | default(autonomy_domain) }}"
    record: "{{ item['record'] }}"
    type: "CNAME"
    value: "{{ item['value'] }}"
    state: "present"
    proxied: "{{ item['proxied'] | default(autonomy_dns_cloudflare_proxied) }}"
    solo: "{{ autonomy_dns_cloudflare_solo }}"
    timeout: "{{ autonomy_dns_cloudflare_timeout }}"
    ttl: "{{ autonomy_dns_cloudflare_ttl }}"
  loop: "{{ autonomy_dns_cloudflare_cname_records }}"
  become: false
  vars:
    __password_lookup: "{{ autonomy_passdb }}/{{ autonomy_domain }}/external/cloudflare/dns"
    __cloudflare_key: "{{ lookup('community.general.passwordstore', __password_lookup) }}"
  when:
    - autonomy_dns_cloudflare_cname_records is truthy

- name: "Cloudflare: Add or modify MX records."
  community.general.cloudflare_dns:
    #account_email: "{{ autonomy_dns_cloudflare_email }}"
    api_token: "{{ __cloudflare_key }}"
    zone: "{{ item['zone'] | default(autonomy_domain) }}"
    record: "{{ item['record'] }}"
    type: "MX"
    value: "{{ item['value'] }}"
    priority: "{{ item['priority'] | default(autonomy_dns_mx_record_priority) }}"
    state: "present"
    solo: "{{ item['solo'] }}"
    timeout: "{{ autonomy_dns_cloudflare_timeout }}"
    ttl: "{{ autonomy_dns_cloudflare_ttl }}"
  loop: "{{ autonomy_dns_cloudflare_mx_records }}"
  become: false
  vars:
    __password_lookup: "{{ autonomy_passdb }}/{{ autonomy_domain }}/external/cloudflare/dns"
    __cloudflare_key: "{{ lookup('community.general.passwordstore', __password_lookup) }}"
  when:
    - autonomy_dns_cloudflare_mx_records is truthy

- name: "Cloudflare: Add or modify TXT records."
  community.general.cloudflare_dns:
    #account_email: "{{ autonomy_dns_cloudflare_email }}"
    api_token: "{{ __cloudflare_key }}"
    zone: "{{ item['zone'] | default(autonomy_domain) }}"
    record: "{{ item['record'] }}"
    type: "TXT"
    state: "present"
    value: "{{ item['value'] }}"
    timeout: "{{ autonomy_dns_cloudflare_timeout }}"
    ttl: "{{ autonomy_dns_cloudflare_ttl }}"
  loop: "{{ autonomy_dns_cloudflare_txt_records }}"
  become: false
  vars:
    __password_lookup: "{{ autonomy_passdb }}/{{ autonomy_domain }}/external/cloudflare/dns"
    __cloudflare_key: "{{ lookup('community.general.passwordstore', __password_lookup) }}"
  when:
    - autonomy_dns_cloudflare_txt_records is truthy

