---
- name: "Download Hagezi RPZ files."
  ansible.builtin.get_url:
    url: "{{ item['url'] }}"
    dest: "{{ item['path'] }}"
    owner: "{{ autonomy_bind_owner }}"
    group: "{{ autonomy_bind_group }}"
    mode: "0644"
  loop: "{{ autonomy_bind_rpz_hagezi_zones }}"
  become: true
  when:
    - autonomy_virtual_host is falsy
    - autonomy_bind_rpz_hagezi_enabled
  notify: restart bind
  tags:
    - dns
    - dns-file

- name: "Flush Handlers for DNS Servers."
  ansible.builtin.meta: flush_handlers
  when:
    - autonomy_virtual_host is falsy
    - autonomy_bind_rpz_hagezi_enabled
  tags:
    - dns
    - dns-file
