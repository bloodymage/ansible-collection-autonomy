---
- name: "Include Family Tasks."
  include_tasks: "upgrade_{{ ansible_os_family | lower }}.yml"
  when:
    - inventory_hostname not in groups["vendor_managed"]
    - autonomy_common_virtual_host is falsy
    - ansible_connection != "local"

- name: "Include NetworkOS tasks."
  include_tasks: "upgrade_{{ ansible_network_os.split('.')[2] | lower }}.yml"
  when:
    - ansible_network_os is defined
