---
# tasks file for screen
# ======================================================================
#
# Tasks:
#  
#
# ======================================================================
- name: Include OS-specific variables.
  include_vars: "{{ lookup('first_found', params) }}"
  vars:
    params:
      files: "{{ __os_variables_files }}"
      paths:
        - "vars"
  become: false
  tags:
    - screen
    - install-packages

- name: "Install packages"
  ansible.builtin.package:
    name: "{{ autonomy_screen_packages }}"
    state: present
  become: true
  tags:
    - screen
    - install-packages

- name: "Install config file"
  ansible.builtin.template:
    src: "screenrc.j2"
    dest: "{{ autonomy_common_sysconf_dir }}/screenrc"
    owner: "root"
    group: "root"
    mode: "0644"
  become: true
  tags:
    - screen
