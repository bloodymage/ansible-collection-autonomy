---
- name: "Install Apache site.conf."
  ansible.builtin.template:
    src: "etc/apache/site.conf.j2"
    dest: "/etc/apache2/sites-available/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - item.content is defined
    - item.content == "crls"
    - item.enabled is defined
    - item.enabled
  notify: reload apache
  tags:
    - ownca-crl-distribution-points
    - autonomy_common_ownca_crl_distribution_points

- name: "Create list of cert authorities."
  ansible.builtin.set_fact:
    autonomy_common_ownca_crl_distribution_points: "{{ autonomy_common_ownca_crl_distribution_points + [__additional_cert_auth] }}"
  loop: "{{ autonomy_common_zones | product(__ownca_certificate_authorities_id) }}"
  vars:
    __additional_cert_auth: "{{ autonomy_common_org_name }}-{{ item[0].name }}-{{ item[1] }}"
  become: false
  when:
    - item[0].name != "root"
    - (item[1] != "component-ca" or item[1] != "identity-ca")
    - item[0].type != "public"
  tags:
    - ownca-crl-distribution-points
    - autonomy_common_ownca_crl_distribution_points

- name: "Copy CRLs to server."
  ansible.builtin.copy:
    src: "{{ autonomy_ownca_ca_directory }}/crl/{{ item }}.crl"
    dest: "/srv/www/{{ vhost.name }}/{{ item }}.crl"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ autonomy_common_ownca_crl_distribution_points }}"
  become: true
  tags:
    - ownca-crl-distribution-points
    - ownca-crl
