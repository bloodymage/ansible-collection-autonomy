- name: "Generate PKCS#12 file." # noqa: jinja[spacing]
  community.crypto.openssl_pkcs12:
    path: "{{ autonomy_ownca_host_sysconf_pkcs12_path }}"
    certificate_path: "{{ autonomy_ownca_host_usr_cert_path }}"
    privatekey_path: "{{ autonomy_ownca_host_private_key_path }}"
    passphrase: "{{ __password }}"
    other_certificates:
      - "{{ autonomy_ownca_componentca_usr_cert_path }}"
      - "{{ autonomy_ownca_intermediateca_usr_cert_path }}"
      - "{{ autonomy_ownca_rootca_usr_cert_path }}"
    friendly_name: "{{ inventory_hostname }}"
    action: export
    owner: "{{ autonomy_ownca_host_pkcs12_owner }}"
    group: "{{ autonomy_ownca_host_pkcs12_group }}"
    mode: "{{ autonomy_ownca_host_pkcs12_mode }}"
    state: present
    backup: "{{ 'false' if autonomy_common_etckeeper_enabled else 'true' }}"
    # force: "{{ __autonomy_common_ownca_regenerate_csr }}"
  become: true
  vars:
    __password: >-
      {% if autonomy_ownca_host_pkcs12_password == "password" -%}
      {{ lookup('community.general.passwordstore', autonomy_ownca_host_pkcs12_password_store_lookup) }}
      {%- else -%}
      {{ autonomy_ownca_host_pkcs12_password }}
      {%- endif %}


