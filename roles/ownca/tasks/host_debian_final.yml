- name: "Copy CA Certificates to server."
  ansible.builtin.copy:
    src: "{{ item['src'] }}"
    dest: "{{ item['dest'] }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ autonomy_ownca_ca_certs }}"
  become: true
  notify: restart tls

