---
# ==================================================================================================
#
# Tasks: Copy Host Certificate back to Server.
#
#
# ==================================================================================================
- name: "Copy Host Certificate."
  ansible.builtin.copy:
    src: "{{ autonomy_ownca_hosts_cert_path }}"
    dest: "{{ autonomy_ownca_host_usr_cert_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
  become: true
  notify: restart tls

- name: "Copy Host Certificate Chain."
  ansible.builtin.copy:
    src: "{{ autonomy_ownca_hosts_chain_path }}"
    dest: "{{ autonomy_ownca_host_usr_chain_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
  become: true
  notify: restart tls

