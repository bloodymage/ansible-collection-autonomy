---
- name: "Create SSL Directories."
  ansible.builtin.file:
    path: "{{ item['name'] }}"
    owner: "{{ item['owner'] }}"
    group: "{{ item['group'] }}"
    mode: "{{ item['mode'] }}"
    state: directory
  loop: "{{ autonomy_ownca_hosts_dirs }}"
  become: false
  delegate_to: "{{ autonomy_ownca_certificate_authority_host }}"
  run_once: true

- name: "Add subject alt names based on ipv6."
  ansible.builtin.set_fact:
    autonomy_ownca_host_subject_alt_name: "{{ autonomy_ownca_host_subject_alt_name + [__alt_name] }}"
  vars:
    __alt_name: "IP:{{ autonomy_common_ipv6_address }}"
  become: false
  when:
    - autonomy_common_ipv6_address is truthy

