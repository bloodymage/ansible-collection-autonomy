- name: "Add additional subject alt names for samba domain controllers."
  ansible.builtin.set_fact:
    autonomy_ownca_host_subject_alt_name: "{{ autonomy_ownca_host_subject_alt_name + __alt_name }}"
  vars:
    __alt_name:
      - "DNS:{{ autonomy_common_zone_domain }}"
      - "otherName:{{ autonomy_ownca_msadguid_oid }};UTF8:{{ autonomy_ownca_objectguid }}"
  become: false
  when:
    - inventory_hostname in groups['samba_domain_controllers'] | default([])
    - autonomy_ownca_objectguid is truthy

- name: "Set extended key usage based on role."
  ansible.builtin.set_fact:
    autonomy_ownca_host_extended_key_usage: "{{ autonomy_ownca_host_extended_key_usage + [item.extended_key_uasge] }}"
  loop:
    - name: "samba_domain_controllers"
      extended_key_uasge: "{{ autonomy_ownca_mskdc_oid }}"
  become: false
  when:
    - inventory_hostname in groups[item.name] | default([])

- name: "Setup OwnCA: Definitions."
  ansible.builtin.include_tasks: "ca_definitions.yml"

- name: "Get Component CA Cert information."
  community.crypto.x509_certificate_info:
    path: "{{ autonomy_ownca_componentca_cert_path }}"
  register: __autonomy_ownca_componentca_cert_info
  delegate_to: "{{ autonomy_ownca_certificate_authority_host }}"
  become: false

- name: "Include OS Family Preparation Tasks."
  ansible.builtin.include_tasks: "host_{{ ansible_os_family | lower }}_prep.yml"
  when:
    - ansible_network_os is not defined
    - ansible_os_family is defined
    - not autonomy_ownca_generate_locally
    - inventory_hostname not in groups["vendor_managed"]

- name: "Include Localhost Preparation Tasks."
  ansible.builtin.include_tasks: "host_localhost_prep.yml"
  when:
    - ansible_network_os is defined or autonomy_ownca_generate_locally or inventory_hostname in groups["vendor_managed"]

