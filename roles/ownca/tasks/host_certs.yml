- name: "Generate Host Certificate." # noqa: jinja[spacing]
  community.crypto.x509_certificate:
    path: "{{ autonomy_ownca_hosts_cert_path }}"
    csr_path: "{{ autonomy_ownca_hosts_csr_path }}"
    ownca_path: "{{ autonomy_ownca_componentca_cert_path }}"
    ownca_privatekey_path: "{{ autonomy_ownca_componentca_key_path }}"
    ownca_privatekey_passphrase: "{{ __password }}"
    provider: ownca
    owner: "{{ autonomy_ownca_user }}"
    group: "{{ autonomy_ownca_group }}"
    mode: "{{ autonomy_ownca_hosts_cert_mode }}"
    backup: "{{ autonomy_ownca_host_cert_backup }}"
    # force: "{{ __host_cert_force_regeneration }}"
  become: false
  delegate_to: "{{ autonomy_ownca_certificate_authority_host }}"
  vars:
    __password: >-
      {% if autonomy_ownca_componentca_password == "password" -%}
      {{ lookup('community.general.passwordstore', autonomy_ownca_componentca_password_store_lookup) }}
      {%- else -%}
      {{ autonomy_ownca_componentca_password }}
      {%- endif %}

- name: "Identify Certificate Complete Chain."
  community.crypto.certificate_complete_chain:
    input_chain: "{{ lookup('file', autonomy_ownca_hosts_cert_path) }}"
    intermediate_certificates:
      - "{{ autonomy_ownca_componentca_cert_path }}"
      - "{{ autonomy_ownca_intermediateca_cert_path }}"
    root_certificates:
      - "{{ autonomy_ownca_rootca_cert_path }}"
  register: parent_cert_authorities
  become: false
  delegate_to: "{{ autonomy_ownca_certificate_authority_host }}"

# ==================================================================================================
#
# TODO: Need to identify if the chain has actually changed before writing the new chain file.
#
# ==================================================================================================
- name: "Write complete chain to disk."
  ansible.builtin.copy:
    dest: "{{ autonomy_ownca_hosts_chain_path }}"
    content: "{{ ''.join(parent_cert_authorities.complete_chain) }}"
    owner: "{{ autonomy_ownca_user }}"
    group: "{{ autonomy_ownca_group }}"
    mode: "{{ autonomy_ownca_hosts_chain_mode }}"
  become: false
  delegate_to: "{{ autonomy_ownca_certificate_authority_host }}"
  when:
    - parent_cert_authorities.complete_chain is defined

- name: "Include OS Family Finalization Tasks."
  ansible.builtin.include_tasks: "host_{{ ansible_os_family | lower }}_final.yml"
  when:
    - ansible_network_os is not defined
    - ansible_os_family is defined
    - not autonomy_ownca_generate_locally
    - inventory_hostname not in groups["vendor_managed"]

