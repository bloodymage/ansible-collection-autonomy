---
autonomy_ownca_host_private_key_file: "{{ inventory_hostname }}.key"
autonomy_ownca_host_private_key_path: "{{ autonomy_ownca_sysconf_private_key_dir }}/{{ autonomy_ownca_host_private_key_file }}"

autonomy_ownca_host_csr_file: "{{ inventory_hostname }}.csr"
autonomy_ownca_host_csr_path: "{{ autonomy_ownca_sysconf_csr_dir }}/{{ autonomy_ownca_host_csr_file }}"

autonomy_ownca_host_cert_file: "{{ inventory_hostname }}.crt"
autonomy_ownca_host_sysconf_cert_path: "{{ autonomy_ownca_sysconf_cert_dir }}/{{ autonomy_ownca_host_cert_file }}"
autonomy_ownca_host_usr_cert_path: "{{ autonomy_ownca_data_dir }}/{{ autonomy_ownca_host_cert_file }}"

autonomy_ownca_host_chain_file: "{{ inventory_hostname }}-chain.crt"
autonomy_ownca_host_sysconf_chain_path: "{{ autonomy_ownca_sysconf_cert_dir }}/{{ autonomy_ownca_host_chain_file }}"
autonomy_ownca_host_usr_chain_path: "{{ autonomy_ownca_data_dir }}/{{ autonomy_ownca_host_chain_file }}"

autonomy_ownca_host_pkcs12_file: "{{ inventory_hostname }}.pkcs12"
autonomy_ownca_host_sysconf_pkcs12_path: "{{ autonomy_ownca_sysconf_pkcs12_dir }}/{{ autonomy_ownca_host_pkcs12_file }}"

autonomy_ownca_host_cert_dir_owner: "{{ autonomy_ownca_sysconf_dir_owner }}"
autonomy_ownca_host_cert_dir_group: "{{ autonomy_ownca_sysconf_dir_group }}"
autonomy_ownca_host_cert_dir_mode: "0755"

autonomy_ownca_host_csr_dir_owner: "{{ autonomy_ownca_sysconf_dir_owner }}"
autonomy_ownca_host_csr_dir_group: "{{ autonomy_ownca_sysconf_dir_group }}"
autonomy_ownca_host_csr_dir_mode: "0700"

autonomy_ownca_host_private_dir_owner: "{{ autonomy_ownca_sysconf_dir_owner }}"
autonomy_ownca_host_private_dir_group: "{{ autonomy_ownca_sysconf_dir_group }}"
autonomy_ownca_host_private_dir_mode: "0700"

autonomy_ownca_host_crl_dir_owner: "{{ autonomy_ownca_sysconf_dir_owner }}"
autonomy_ownca_host_crl_dir_group: "{{ autonomy_ownca_sysconf_dir_group }}"
autonomy_ownca_host_crl_dir_mode: "0700"

autonomy_ownca_host_pkcs12_dir_owner: "{{ autonomy_ownca_sysconf_dir_owner }}"
autonomy_ownca_host_pkcs12_dir_group: "{{ autonomy_ownca_sysconf_dir_group }}"
autonomy_ownca_host_pkcs12_dir_mode: "0700"

autonomy_ownca_data_dir_owner: "{{ autonomy_ownca_sysconf_dir_owner }}"
autonomy_ownca_data_dir_group: "{{ autonomy_ownca_sysconf_dir_group }}"
autonomy_ownca_data_dir_mode: "0755"

autonomy_ownca_host_dhparams_dir_owner: "{{ autonomy_ownca_sysconf_dir_owner }}"
autonomy_ownca_host_dhparams_dir_group: "{{ autonomy_ownca_sysconf_dir_group }}"
autonomy_ownca_host_dhparams_dir_mode: "0755"


autonomy_ownca_host_dirs:
  - name: "{{ autonomy_ownca_sysconf_certs_dir }}"
    owner: "{{ autonomy_ownca_host_cert_dir_owner }}"
    group: "{{ autonomy_ownca_host_cert_dir_group }}"
    mode: "{{ autonomy_ownca_host_cert_dir_mode }}"
  - name: "{{ autonomy_ownca_sysconf_csr_dir }}"
    owner: "{{ autonomy_ownca_host_csr_dir_owner }}"
    group: "{{ autonomy_ownca_host_csr_dir_group }}"
    mode: "{{ autonomy_ownca_host_csr_dir_mode }}"
  - name: "{{ autonomy_ownca_sysconf_private_key_dir }}"
    owner: "{{ autonomy_ownca_host_private_dir_owner }}"
    group: "{{ autonomy_ownca_host_private_dir_group }}"
    mode: "{{ autonomy_ownca_host_private_dir_mode }}"
  - name: "{{ autonomy_ownca_sysconf_crl_dir }}"
    owner: "{{ autonomy_ownca_host_crl_dir_owner }}"
    group: "{{ autonomy_ownca_host_crl_dir_group }}"
    mode: "{{ autonomy_ownca_host_crl_dir_mode }}"
  - name: "{{ autonomy_ownca_sysconf_pkcs12_dir }}"
    owner: "{{ autonomy_ownca_host_pkcs12_dir_owner }}"
    group: "{{ autonomy_ownca_host_pkcs12_dir_group }}"
    mode: "{{ autonomy_ownca_host_pkcs12_dir_mode }}"
  - name: "{{ autonomy_ownca_data_dir }}"
    owner: "{{ autonomy_ownca_data_dir_owner }}"
    group: "{{ autonomy_ownca_data_dir_group }}"
    mode: "{{ autonomy_ownca_data_dir_mode }}"
  - name: "{{ autonomy_ownca_sysconf_dhparams_dir }}"
    owner: "{{ autonomy_ownca_host_dhparams_dir_owner }}"
    group: "{{ autonomy_ownca_host_dhparams_dir_group }}"
    mode: "{{ autonomy_ownca_host_dhparams_dir_mode }}"

autonomy_ownca_host_private_key_owner: "{{ autonomy_ownca_host_private_dir_owner }}"
autonomy_ownca_host_private_key_group: "{{ autonomy_ownca_host_private_dir_group }}"
autonomy_ownca_host_private_key_mode: "0600"

autonomy_ownca_host_csr_owner: "{{ autonomy_ownca_host_csr_dir_owner }}"
autonomy_ownca_host_csr_group: "{{ autonomy_ownca_host_csr_dir_group }}"
autonomy_ownca_host_csr_mode: "0644"

autonomy_ownca_host_pkcs12_owner: "{{ autonomy_ownca_host_pkcs12_dir_owner }}"
autonomy_ownca_host_pkcs12_group: "{{ autonomy_ownca_host_pkcs12_dir_group }}"
autonomy_ownca_host_pkcs12_mode: "0600"

autonomy_ownca_host_subject_alt_name:
  - "DNS:{{ inventory_hostname }}"
  - "IP:{{ ansible_host }}"


autonomy_ownca_host_key_usage:
  - digitalSignature
  - keyEncipherment
autonomy_ownca_host_key_usage_critical: true
autonomy_ownca_host_extended_key_usage:
  - serverAuth
  - clientAuth
autonomy_ownca_host_extended_key_usage_critical: true
autonomy_ownca_host_cert_backup: false

autonomy_ownca_objectguid: ""

# Passwords
autonomy_ownca_host_pkcs12_password_length: "{{ autonomy_ownca_password_length }}"
autonomy_ownca_host_pkcs12_password: "password"

autonomy_ownca_host_pkcs12_password_store_id: "{{ autonomy_common_password_db }}/{{ autonomy_common_zone_domain }}/ownca/hosts/{{ inventory_hostname }}/ownca_host_cert_pkcs12_password"
autonomy_ownca_host_pkcs12_password_store_length: "length={{ autonomy_ownca_host_pkcs12_password_length }}"
autonomy_ownca_host_pkcs12_password_store_overwrite: "overwrite={{ autonomy_common_password_overwrite }} backup=true"
autonomy_ownca_host_pkcs12_password_store_create: "create=true missing=create"
autonomy_ownca_host_pkcs12_password_store_symbols: "nosymbols={{ autonomy_common_password_no_symbols }}"
autonomy_ownca_host_pkcs12_password_store_lookup: >-
  {{ autonomy_ownca_host_pkcs12_password_store_id }}
  {{ autonomy_ownca_host_pkcs12_password_store_length }}
  {{ autonomy_ownca_host_pkcs12_password_store_overwrite }}
  {{ autonomy_ownca_host_pkcs12_password_store_create }}
  {{ autonomy_ownca_host_pkcs12_password_store_symbols }}
