---
# Hosts
autonomy_ownca_hosts_dir: "{{ autonomy_ownca_dir }}/hosts"
autonomy_ownca_hosts_private_dir: "{{ autonomy_ownca_hosts_dir }}/private"
autonomy_ownca_hosts_private_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_hosts_private_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_hosts_private_dir_mode: "0700"

autonomy_ownca_hosts_csr_dir: "{{ autonomy_ownca_hosts_dir }}/csr"
autonomy_ownca_hosts_csr_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_hosts_csr_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_hosts_csr_dir_mode: "0700"

autonomy_ownca_hosts_pkcs12_dir: "{{ autonomy_ownca_hosts_dir }}/pkcs12"
autonomy_ownca_hosts_pkcs12_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_hosts_pkcs12_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_hosts_pkcs12_dir_mode: "0700"

autonomy_ownca_hosts_certs_dir: "{{ autonomy_ownca_hosts_dir }}/certs"
autonomy_ownca_hosts_certs_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_hosts_certs_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_hosts_certs_dir_mode: "0700"

autonomy_ownca_hosts_crls_dir: "{{ autonomy_ownca_hosts_dir }}/crls"
autonomy_ownca_hosts_crls_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_hosts_crls_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_hosts_crls_dir_mode: "0700"

autonomy_ownca_hosts_dirs:
  - name: "{{ autonomy_ownca_hosts_private_dir }}"
    owner: "{{ autonomy_ownca_hosts_private_dir_owner }}"
    group: "{{ autonomy_ownca_hosts_private_dir_group }}"
    mode: "{{ autonomy_ownca_hosts_private_dir_mode }}"
  - name: "{{ autonomy_ownca_hosts_csr_dir }}"
    owner: "{{ autonomy_ownca_hosts_csr_dir_owner }}"
    group: "{{ autonomy_ownca_hosts_csr_dir_group }}"
    mode: "{{ autonomy_ownca_hosts_csr_dir_mode }}"
  - name: "{{ autonomy_ownca_hosts_pkcs12_dir }}"
    owner: "{{ autonomy_ownca_hosts_pkcs12_dir_owner }}"
    group: "{{ autonomy_ownca_hosts_pkcs12_dir_group }}"
    mode: "{{ autonomy_ownca_hosts_pkcs12_dir_mode }}"
  - name: "{{ autonomy_ownca_hosts_certs_dir }}"
    owner: "{{ autonomy_ownca_hosts_certs_dir_owner }}"
    group: "{{ autonomy_ownca_hosts_certs_dir_group }}"
    mode: "{{ autonomy_ownca_hosts_certs_dir_mode }}"
  - name: "{{ autonomy_ownca_hosts_crls_dir }}"
    owner: "{{ autonomy_ownca_hosts_crls_dir_owner }}"
    group: "{{ autonomy_ownca_hosts_crls_dir_group }}"
    mode: "{{ autonomy_ownca_hosts_crls_dir_mode }}"

autonomy_ownca_hosts_private_key_path: "{{ autonomy_ownca_hosts_private_dir }}/{{ autonomy_ownca_host_private_key_file }}"
autonomy_ownca_hosts_private_key_mode: "0600"

autonomy_ownca_hosts_csr_path: "{{ autonomy_ownca_hosts_csr_dir }}/{{ autonomy_ownca_host_csr_file }}"
autonomy_ownca_hosts_csr_mode: "0644"

autonomy_ownca_hosts_cert_path: "{{ autonomy_ownca_hosts_certs_dir }}/{{ autonomy_ownca_host_cert_file }}"
autonomy_ownca_hosts_cert_mode: "0644"

autonomy_ownca_hosts_chain_path: "{{ autonomy_ownca_hosts_certs_dir }}/{{ autonomy_ownca_host_chain_file }}"
autonomy_ownca_hosts_chain_mode: "0600"
