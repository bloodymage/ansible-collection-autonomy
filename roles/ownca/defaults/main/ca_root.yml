---
autonomy_ownca_rootca_common_name: "{{ autonomy_common_org_name | title }} Root CA"
autonomy_ownca_rootca_email_address: ""
autonomy_ownca_rootca_org_name: "{{ autonomy_common_org_name | title }}"
autonomy_ownca_rootca_keyusage:
  - "keyCertSign"
  - "cRLSign"
autonomy_ownca_rootca_keyusage_critical: true
autonomy_ownca_rootca_basic_constraints:
  - 'CA:TRUE'
autonomy_ownca_rootca_basic_constraints_critical: true
autonomy_ownca_rootca_create_subject_key_identifier: true
autonomy_ownca_rootca_crl_distribution_points_reasons:
  - key_compromise
  - ca_compromise
  - affiliation_changed
  - superseded
  - cessation_of_operation
  - certificate_hold
  - privilege_withdrawn
  - aa_compromise
autonomy_ownca_rootca_csr_backup: false
autonomy_ownca_rootca_not_after: "+3650d"

autonomy_ownca_rootca_revoked_certificates: []


# Root CA Files
autonomy_ownca_rootca_key_file: "{{ autonomy_common_org_name }}-root-ca.key"
autonomy_ownca_rootca_csr_file: "{{ autonomy_common_org_name }}-root-ca.csr"
autonomy_ownca_rootca_cert_file: "{{ autonomy_common_org_name }}-root-ca"
autonomy_ownca_rootca_chain_file: "{{ autonomy_common_org_name }}-root-ca-chain"
autonomy_ownca_rootca_crl_file: "{{ autonomy_common_org_name }}-root.crl"

# Root CA Paths
autonomy_ownca_rootca_key_path: "{{ autonomy_ownca_ca_private_key_dir }}/{{ autonomy_ownca_rootca_key_file }}"
autonomy_ownca_rootca_csr_path: "{{ autonomy_ownca_ca_csr_dir }}/{{ autonomy_ownca_rootca_csr_file }}"
autonomy_ownca_rootca_cert_path: "{{ autonomy_ownca_ca_certs_dir }}/{{ autonomy_ownca_rootca_cert_file }}.crt"
autonomy_ownca_rootca_chain_path: "{{ autonomy_ownca_ca_certs_dir }}/{{ autonomy_ownca_rootca_chain_file }}.crt"
autonomy_ownca_rootca_sysconf_cert_path: "{{ autonomy_ownca_sysconf_certs_dir }}/{{ autonomy_ownca_rootca_cert_file }}.pem"
autonomy_ownca_rootca_sysconf_chain_path: "{{ autonomy_ownca_sysconf_certs_dir }}/{{ autonomy_ownca_rootca_chain_file }}.pem"
autonomy_ownca_rootca_usr_cert_path: "{{ autonomy_ownca_data_dir }}/{{ autonomy_ownca_rootca_cert_file }}.crt"
autonomy_ownca_rootca_usr_chain_path: "{{ autonomy_ownca_data_dir }}/{{ autonomy_ownca_rootca_chain_file }}.crt"
autonomy_ownca_rootca_crl_path: "{{ autonomy_ownca_ca_crl_dir }}/{{ autonomy_ownca_root_crl_file }}"
autonomy_ownca_rootca_sysconf_crl_path: "{{ aautonomy_ownca_sysconf_crl_dir }}/{{ autonomy_ownca_root_crl_file }}"

# URLs
autonomy_ownca_rootca_crl_distribution_point_url: "{{ autonomy_ownca_crl_distribution_point }}/{{ autonomy_common_org_name }}-root-ca.crl"

# Password Config
autonomy_ownca_rootca_password_length: "{{ autonomy_ownca_password_length }}"
autonomy_ownca_rootca_password: "password"

autonomy_ownca_rootca_password_store_id: "{{ autonomy_common_password_root_ownca }}/ownca_root_password"
autonomy_ownca_rootca_password_store_length: "length={{ autonomy_ownca_rootca_password_length }}"
autonomy_ownca_rootca_password_store_overwrite: "overwrite={{ autonomy_common_password_overwrite }} backup=yes"
autonomy_ownca_rootca_password_store_create: "create=true missing=create"
autonomy_ownca_rootca_password_store_symbols: "nosymbols={{ autonomy_common_password_no_symbols }}"
autonomy_ownca_rootca_password_store_lookup: >-
  {{ autonomy_ownca_rootca_password_store_id }}
  {{ autonomy_ownca_rootca_password_store_length }}
  {{ autonomy_ownca_rootca_password_store_overwrite }}
  {{ autonomy_ownca_rootca_password_store_create }}
  {{ autonomy_ownca_rootca_password_store_symbols }}
