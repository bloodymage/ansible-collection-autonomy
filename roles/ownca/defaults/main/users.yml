# ==================================================================================================
#
# While I know the key usage and extended key usage work, I am not sure if they are right.
#
# ==================================================================================================
autonomy_ownca_user_cert_purposes:
  - name: authentication
    key_usage:
      - "nonRepudiation"
      - "digitalSignature"
      - "keyEncipherment"
    extended_key_usage:
      - "clientAuth"
      - "msSmartcardLogin"
  - name: identification
    key_usage:
      - "digitalSignature"
    extended_key_usage:
      - "emailProtection"
      - "clientAuth"
  - name: encryption
    key_usage:
      - "keyEncipherment"
    extended_key_usage:
      - "emailProtection"
      - "1.3.6.1.4.1.311.67.1.1"
      #- "msEFS"
