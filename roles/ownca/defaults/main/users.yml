---
# Users
autonomy_ownca_users_dir: "{{ autonomy_ownca_dir }}/users"
autonomy_ownca_users_private_dir: "{{ autonomy_ownca_users_dir }}/private"
autonomy_ownca_users_private_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_users_private_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_users_private_dir_mode: "0700"

autonomy_ownca_users_csr_dir: "{{ autonomy_ownca_users_dir }}/csr"
autonomy_ownca_users_csr_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_users_csr_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_users_csr_dir_mode: "0700"

autonomy_ownca_users_pkcs12_dir: "{{ autonomy_ownca_users_dir }}/pkcs12"
autonomy_ownca_users_pkcs12_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_users_pkcs12_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_users_pkcs12_dir_mode: "0700"

autonomy_ownca_users_certs_dir: "{{ autonomy_ownca_users_dir }}/certs"
autonomy_ownca_users_certs_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_users_certs_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_users_certs_dir_mode: "0700"

autonomy_ownca_users_crls_dir: "{{ autonomy_ownca_users_dir }}/crls"
autonomy_ownca_users_crls_dir_owner: "{{ autonomy_ownca_user }}"
autonomy_ownca_users_crls_dir_group: "{{ autonomy_ownca_group }}"
autonomy_ownca_users_crls_dir_mode: "0700"

autonomy_ownca_users_dirs:
  - name: "{{ autonomy_ownca_users_private_dir }}"
    owner: "{{ autonomy_ownca_users_private_dir_owner }}"
    group: "{{ autonomy_ownca_users_private_dir_group }}"
    mode: "{{ autonomy_ownca_users_private_dir_mode }}"
  - name: "{{ autonomy_ownca_users_csr_dir }}"
    owner: "{{ autonomy_ownca_users_csr_dir_owner }}"
    group: "{{ autonomy_ownca_users_csr_dir_group }}"
    mode: "{{ autonomy_ownca_users_csr_dir_mode }}"
  - name: "{{ autonomy_ownca_users_pkcs12_dir }}"
    owner: "{{ autonomy_ownca_users_pkcs12_dir_owner }}"
    group: "{{ autonomy_ownca_users_pkcs12_dir_group }}"
    mode: "{{ autonomy_ownca_users_pkcs12_dir_mode }}"
  - name: "{{ autonomy_ownca_users_certs_dir }}"
    owner: "{{ autonomy_ownca_users_certs_dir_owner }}"
    group: "{{ autonomy_ownca_users_certs_dir_group }}"
    mode: "{{ autonomy_ownca_users_certs_dir_mode }}"
  - name: "{{ autonomy_ownca_users_crls_dir }}"
    owner: "{{ autonomy_ownca_users_crls_dir_owner }}"
    group: "{{ autonomy_ownca_users_crls_dir_group }}"
    mode: "{{ autonomy_ownca_users_crls_dir_mode }}"

