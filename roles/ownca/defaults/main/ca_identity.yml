---
autonomy_ownca_identityca_common_name: "{{ autonomy_common_org_name | title }} {{ autonomy_common_org_unit_name | title }} Component CA"
autonomy_ownca_identityca_email_address: ""
autonomy_ownca_identityca_org_name: "{{ autonomy_common_org_name | title }}"
autonomy_ownca_identityca_org_unit_name: "{{ autonomy_common_org_unit_name | title }}"
autonomy_ownca_identityca_keyusage:
  - "keyCertSign"
  - "cRLSign"
autonomy_ownca_identityca_keyusage_critical: true
autonomy_ownca_identityca_basic_constraints:
  - 'CA:TRUE'
autonomy_ownca_identityca_basic_constraints_critical: true
autonomy_ownca_identityca_create_subject_key_identifier: true
autonomy_ownca_identityca_crl_distribution_points_reasons:
  - key_compromise
  - ca_compromise
  - affiliation_changed
  - superseded
  - cessation_of_operation
  - certificate_hold
  - privilege_withdrawn
  - aa_compromise
autonomy_ownca_identityca_csr_backup: false
autonomy_ownca_identityca_revoked_certificates: []
autonomy_ownca_identityca_not_after: "+3600d"

# Identity CA Files
autonomy_ownca_identityca_key_file: "{{ autonomy_common_org_name }}-{{ autonomy_common_org_unit_name }}-identity-ca.key"
autonomy_ownca_identityca_csr_file: "{{ autonomy_common_org_name }}-{{ autonomy_common_org_unit_name }}-identity-ca.csr"
autonomy_ownca_identityca_cert_file: "{{ autonomy_common_org_name }}-{{ autonomy_common_org_unit_name }}-identity-ca"
autonomy_ownca_identityca_chain_file: "{{ autonomy_common_org_name }}-{{ autonomy_common_org_unit_name }}-identity-ca-chain"
autonomy_ownca_identityca_crl_file: "{{ autonomy_common_org_name }}-{{ autonomy_common_org_unit_name }}-identity.crl"

# Identity CA Paths
autonomy_ownca_identityca_key_path: "{{ autonomy_ownca_ca_private_key_dir }}/{{ autonomy_ownca_identityca_key_file }}"
autonomy_ownca_identityca_csr_path: "{{ autonomy_ownca_ca_csr_dir }}/{{ autonomy_ownca_identityca_csr_file }}"
autonomy_ownca_identityca_cert_path: "{{ autonomy_ownca_ca_certs_dir }}/{{ autonomy_ownca_identityca_cert_file }}.crt"
autonomy_ownca_identityca_chain_file_path: "{{ autonomy_ownca_usr_dir }}/{{ autonomy_ownca_identityca_chain_file }}.crt"
autonomy_ownca_identityca_etc_cert_path: "{{ autonomy_ownca_sysconf_dir }}/certs/{{ autonomy_ownca_identityca_cert_file }}.pem"
autonomy_ownca_identityca_etc_chain_path: "{{ autonomy_ownca_sysconf_dir }}/certs/{{ autonomy_ownca_identityca_chain_file }}.pem"
autonomy_ownca_identityca_usr_cert_path: "{{ autonomy_ownca_data_dir }}/{{ autonomy_ownca_identityca_cert_file }}.crt"
autonomy_ownca_identityca_usr_chain_path: "{{ autonomy_ownca_data_dir }}/{{ autonomy_ownca_identityca_chain_file }}.crt"
autonomy_ownca_identityca_crl_path: "{{ autonomy_ownca_ca_crl_dir }}/{{ autonomy_ownca_identityca_crl_file }}"
autonomy_ownca_identityca_crl_etc_path: "{{ autonomy_ownca_sysconf_dir }}/crls/{{ autonomy_ownca_identityca_crl_file }}"

autonomy_ownca_identityca_crl_distribution_point_url: "{{ autonomy_ownca_crl_distribution_point }}/{{ autonomy_common_org_name | lower }}-{{ autonomy_common_org_unit_name | lower }}-identity-ca.crl"

# Password Config
autonomy_ownca_identityca_password_length: "{{ autonomy_ownca_password_length }}"
autonomy_ownca_identityca_password: "password"

autonomy_ownca_identityca_password_store_id: "{{ autonomy_common_password_db }}/{{ autonomy_common_root_domain }}/ownca/ownca_identityca_password"
autonomy_ownca_identityca_password_store_length: "length={{ autonomy_ownca_identityca_password_length }}"
autonomy_ownca_identityca_password_store_overwrite: "overwrite={{ autonomy_common_password_overwrite }} backup=yes"
autonomy_ownca_identityca_password_store_create: "create=true missing=create"
autonomy_ownca_identityca_password_store_symbols: "nosymbols={{ autonomy_common_password_no_symbols }}"
autonomy_ownca_identityca_password_store_lookup: >-
  {{ autonomy_ownca_identityca_password_store_id }}
  {{ autonomy_ownca_identityca_password_store_length }}
  {{ autonomy_ownca_identityca_password_store_overwrite }}
  {{ autonomy_ownca_identityca_password_store_create }}
  {{ autonomy_ownca_identityca_password_store_symbols }}
